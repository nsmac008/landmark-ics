name: Build & Publish Landmark ICS v2

on:
  workflow_dispatch: {}
  schedule:
    - cron: '29 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate Landmark calendar
        run: python scrape_to_ics.py
      - name: Validate calendar
        run: |
          test -s public/calendar.ics
          grep -q '^BEGIN:VCALENDAR' public/calendar.ics
          grep -q '^END:VCALENDAR' public/calendar.ics
          grep -q '^BEGIN:VEVENT' public/calendar.ics
          echo "Landmark events: $(grep -c '^BEGIN:VEVENT' public/calendar.ics)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
