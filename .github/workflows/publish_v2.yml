name: Build & Publish Landmark ICS v2

on:
  push:
    branches: [main]
    paths:
      - 'scrape_to_ics.py'
      - 'requirements.txt'
      - '.github/workflows/publish_v2.yml'
  workflow_dispatch: {}
  schedule:
    - cron: '29 */6 * * *'
    - cron: '13 9 1 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate Landmark calendar
        run: python scrape_to_ics.py
      - name: Validate calendar
        run: |
          set -e
          test -s public/calendar.ics
          grep -q '^BEGIN:VCALENDAR' public/calendar.ics
          grep -q '^END:VCALENDAR' public/calendar.ics
          count=$(grep -c '^BEGIN:VEVENT' public/calendar.ics || true)
          echo "Landmark events: $count"
          test "$count" -ge 1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '13 9 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep scheduled workflow active
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/landmark-keepalive.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/landmark-keepalive.txt
          git commit -m 'chore: keep Landmark calendar workflow active' || exit 0
          git push
